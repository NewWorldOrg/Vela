name: Setup
description: Node and the installed dependencies, restored from the cache when yarn.lock has not changed
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '26'
    - id: modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}
        restore-keys: node-modules-${{ runner.os }}-node24-
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --frozen-lockfile
