name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn codegen:verify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build

  stories:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
        shard: [1/2, 2/2]
    name: stories (${{ matrix.theme }}, ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn playwright install --with-deps --only-shell chromium
      - run: yarn build-storybook
      - name: Every story renders in a real browser and carries no accessibility violation
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
          STORYBOOK_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          yarn test-storybook:ci 2>&1 | tee stories.log
      - name: The run covered stories, rather than passing by covering none
        if: ${{ !cancelled() }}
        run: |
          total="$(sed 's/\x1b\[[0-9;]*m//g' stories.log | sed -n 's/.*Tests:.*[, ]\([0-9]\{1,\}\) total.*/\1/p' | tail -1)"
          if [ -z "${total}" ] || [ "${total}" -lt 1 ]; then
            echo "the run reported ${total:-no} tests: the runner is wrapped in concurrently, which reports the exit code of whichever half finishes first, so a server that dies before the tests start would leave this job green having verified nothing" >&2
            exit 1
          fi
          echo "${{ matrix.theme }} ${{ matrix.shard }}: ${total} story tests ran."
