services:
  app:
    image: node:25.2-slim
    working_dir: /code
    volumes:
      - .:/code
    tty: true
    ports:
      - 8080:3000
      - 6006:6006
    environment:
      CARINA_API_BASE_URL: ${CARINA_API_BASE_URL:-http://host.docker.internal:8081}
      DEV_ALLOWED_ORIGINS: ${DEV_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    extra_hosts:
      - host.docker.internal:host-gateway

  # Runs the Storybook test-runner (Playwright-powered) against a built,
  # statically-served Storybook, once per theme, as CI does. Uses the official
  # Playwright image so browsers are preinstalled; the tag matches the bundled
  # playwright-core version. Reuses node_modules from the mounted volume (no
  # install step).
  #   docker compose run --rm storybook-runner
  storybook-runner:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /code
    volumes:
      - .:/code
    profiles: ['test']
    command: sh -c "npm run build-storybook && for theme in light dark; do STORYBOOK_THEME=$$theme npm run test-storybook:ci || exit 1; done"
